# Copy to products.yaml and describe your own products. products.yaml is git-ignored.
# problems_solved, key_features, not_for, one_liner and target_user go into the Claude scoring prompt
# (key_features also decides whether a competitor-review complaint counts as describing_problem);
# search_phrases, subreddits, bluesky, competitors, news_queries and feeds only drive collection and the prefilter.
# search_phrases are searched on Reddit, Hacker News and Bluesky (public search, no key; per-product and
# top-level bluesky sections are optional, both default to enabled).
# competitors (App Store reviews), news_queries (Bing News RSS) and the top-level feeds list (any RSS/Atom URL)
# add review and article sources; all three are optional.
# Tuning tips are in README.md.

products:
  - id: example-app
    name: Example App
    url: https://example.com
    one_liner: "A simple invoice tracker for solo freelancers."
    target_user: "Freelancers who lose track of which clients have paid."
    problems_solved:
      - "I lose hours every month tracking who paid"
      - "Spreadsheets for invoices are a mess"
      - "I forget to chase late payments"
    key_features:
      - "One list of sent, due and paid invoices"
      - "Reminder only when something is late"
      - "Simple client overview"
    not_for:
      - "Accounting or bookkeeping software"
      - "Enterprise billing"
    search_phrases:
      - "track invoices as a freelancer"
      - "chasing late payments"
      - "simple invoicing tool"
    subreddits:
      - freelance
      - smallbusiness
    non_english_subreddits: []
    # Bluesky public search (no key). Danish phrases are searched with lang=da and may be non-English.
    bluesky:
      enabled: true
      danish_phrases: ["faktura freelancer", "rykke for betaling"]
    # Competitor apps whose App Store reviews are collected (id = the number in the apps.apple.com URL).
    competitors:
      - name: Competitor Invoices
        app_store: { id: 123456789, countries: [dk] } # two-letter storefront codes, default [dk]
        # google_play: com.example.invoices # accepted, not collected yet
    # Bing News searches (Danish market, non-English results allowed).
    news_queries: ["freelancer fakturering"]
    # Plays that run after scoring (all optional):
    #   reply_drafts (default true): draft replies to asking_for_tool / describing_problem posts, for you to post by hand.
    #   lead_research (default false): extract organisations from posts and articles and research them as leads.
    #   competitor_intel (default: true when competitors are listed): weekly ideas from competitor-review gaps.
    plays: { reply_drafts: true, lead_research: false, competitor_intel: true }
    # Reply-draft voice (all optional):
    #   examples (default []): replies in your own tone; used as tone reference only, never copied.
    #   never_claim (default []): things a draft must never claim (pricing, integrations you don't have, ...).
    #   link (default null): the only URL a draft may include; null = drafts never link.
    voice:
      examples:
        - "I stopped chasing invoices in a spreadsheet. One list of sent, due and paid, and a reminder only when something is late."
      never_claim: ["pricing or a free plan", "integrations with accounting software"]
      link: https://example.com

# Extra RSS 2.0 / Atom feeds, e.g. Google Alerts with delivery set to "RSS feed".
feeds:
  - name: Google Alert invoicing
    url: https://www.google.com/alerts/feeds/00000000000000000000/0000000000000000000
    products: [example-app] # optional, default: all products
    lang: en # anything other than "en" keeps non-English entries

bluesky:
  enabled: true
  own_handles: [] # your own Bluesky handles, e.g. me.bsky.social; their posts are skipped
