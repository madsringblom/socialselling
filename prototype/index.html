<title>SocialSelling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/*
  Design plan: SocialSelling prototype
  Layout: one calm work surface. Mobile: single column, sticky compact header (52px),
  fixed bottom nav with four tabs. Desktop (>=1024px): 200px left rail; Today and Pipeline
  use a 360px list column plus a detail column (flex 1, max 720px); Intel and Setup are a
  single column, max 760px.
  Color: quiet grey-green neutrals and one sea-teal accent. Semantic good / warn / crit are
  kept separate from the accent. Classification: HOT = crit, STRONG = accent,
  WATCH = warn, ARCHIVE = muted.
  Type: Figtree for UI, Fraunces for page titles only, system mono for scores, counts and
  timestamps. Scale 13 / 14 (body) / 16 / 20 / 26. Eyebrows 12px uppercase, .06em tracking.
  Shape: 10px radius on cards, buttons and fields; 999px on pills and chips; 1px line
  borders; no shadows. Spacing 4 / 8 / 12 / 16 / 24 / 32. Controls 40px tall, 44px tap area.
*/
:root {
  --bg: #F7F8F8;
  --surface: #FFFFFF;
  --surface-2: #EFF3F3;
  --fg: #17201F;
  --fg-muted: #5A6866;
  --line: #DCE3E2;
  --accent: #0A6665;
  --accent-soft: #DDF1F0;
  --on-accent: #FFFFFF;
  --good: #2E7D4F;
  --good-soft: #EAF5EE;
  --warn: #8F5500;
  --warn-soft: #FBF0DF;
  --crit: #B23B3B;
  --crit-soft: #F9E5E4;

  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

  --radius: 10px;
  --radius-pill: 999px;
  --control: 40px;
  --header-h: 52px;
  --nav-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121517;
    --surface: #1A1F22;
    --surface-2: #232A2E;
    --fg: #E8ECEB;
    --fg-muted: #A3AEAC;
    --line: #2C3539;
    --accent: #4FB3B1;
    --accent-soft: #173A39;
    --on-accent: #0B1414;
    --good: #6CC08B;
    --good-soft: #1B3326;
    --warn: #E0A64A;
    --warn-soft: #3A2D14;
    --crit: #E07070;
    --crit-soft: #3D2121;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121517;
  --surface: #1A1F22;
  --surface-2: #232A2E;
  --fg: #E8ECEB;
  --fg-muted: #A3AEAC;
  --line: #2C3539;
  --accent: #4FB3B1;
  --accent-soft: #173A39;
  --on-accent: #0B1414;
  --good: #6CC08B;
  --good-soft: #1B3326;
  --warn: #E0A64A;
  --warn-soft: #3A2D14;
  --crit: #E07070;
  --crit-soft: #3D2121;
  color-scheme: dark;
}

/* Base */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.5 var(--font-ui);
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol, blockquote { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Shell */
.app {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 32px);
  min-height: 100vh;
}
.main { min-width: 0; }
.brand { display: none; }
.icon { width: 20px; height: 20px; flex: none; }
.icon-sm { width: 14px; height: 14px; flex: none; }

.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-btn {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: var(--nav-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: 0;
  border-radius: var(--radius);
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.nav-btn:where(:hover) { color: var(--fg); }
.nav-btn:focus-visible { outline-offset: -4px; }
.nav-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  right: 25%;
  height: 2px;
  border-radius: var(--radius-pill);
  background: var(--accent);
  opacity: 0;
}
.nav-btn[aria-current="page"] { color: var(--accent); }
.nav-btn[aria-current="page"]::before { opacity: 1; }

.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  column-gap: 12px;
  min-height: var(--header-h);
  margin-bottom: 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  /* full-bleed background behind the gutters, clipped below the header */
  box-shadow: 0 0 0 100vmax var(--bg);
  clip-path: inset(-100vmax -100vmax 0 -100vmax);
}
.header-title {
  order: 1;
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 4px;
}
.page-title {
  min-width: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 20px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-meta {
  order: 2;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.header-date { font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
.header-layout {
  order: 3;
  flex: 1 0 100%;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
}

.view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.split { min-width: 0; }
.col-list { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.col-detail { min-width: 0; }
.single { display: flex; flex-direction: column; gap: 24px; max-width: 760px; min-width: 0; }

/* Text helpers */
.eyebrow {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--fg-muted);
}
.meta { font-size: 13px; color: var(--fg-muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.strong { font-weight: 600; }
.end { text-align: right; }
.wrap { overflow-wrap: anywhere; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.line-1 { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.text-warn { color: var(--warn); }
.text-crit { color: var(--crit); }
.inline-icon { display: inline-flex; align-items: center; gap: 4px; }
.stack-4 { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stack-8 { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.link {
  display: inline-block;
  max-width: 100%;
  padding-block: 12px;
  margin-block: -12px;
  color: var(--accent);
  overflow-wrap: anywhere;
  text-underline-offset: 2px;
}
.divider { width: 100%; margin: 8px 0; border: 0; border-top: 1px solid var(--line); }

/* Funnel */
.funnel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 13px; }
.funnel-item { white-space: nowrap; }

/* Sections and cards */
.section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.cards { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  scroll-margin-top: 80px;
}
.card-click { cursor: pointer; }
.card-click:where(:hover) { border-color: var(--fg-muted); }
.is-selected { border-left: 3px solid var(--accent); padding-left: 14px; }
.card-title { min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.card-hit {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 0;
  margin: 0;
  border: 0;
  background: none;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.card-hit::after {
  content: "";
  position: absolute;
  inset: -1px;
  z-index: 1;
  border-radius: var(--radius);
}
.card-hit:focus-visible { outline: none; }
.card-hit:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.card-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.lead-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.score-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.score { font-size: 20px; font-weight: 600; line-height: 1; color: var(--fg); }
.score-big { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; line-height: 1; }

.inset {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 16px;
  background: var(--surface-2);
  border-radius: var(--radius);
}
.quote { padding-left: 12px; border-left: 2px solid var(--line); }

.detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.detail-title { font-size: 20px; font-weight: 600; line-height: 1.3; }
.detail-title:focus { outline: none; }
.display { font-family: var(--font-display); font-weight: 500; }

/* Rows inside cards */
.rows { display: flex; flex-direction: column; min-width: 0; }
.row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding-block: 12px;
  border-top: 1px solid var(--line);
}
:where(.row):first-child { border-top: 0; padding-top: 0; }
:where(.row):last-child { padding-bottom: 0; }
.row-focus {
  padding-block: 12px;
  padding-inline: 8px;
  margin-inline: -8px;
  background: var(--accent-soft);
  border-radius: var(--radius);
}
.brief { display: grid; gap: 8px; padding-left: 20px; list-style: disc; }

/* Bars */
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 48px; gap: 12px; align-items: center; }
.bar { display: block; height: 8px; background: var(--surface-2); border-radius: var(--radius-pill); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--accent); border-radius: var(--radius-pill); }
.dist { display: flex; flex-direction: column; gap: 4px; }
.dist-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 24px; gap: 8px; align-items: center; }

/* Stars */
.stars { white-space: nowrap; letter-spacing: 1px; }
.star-on { color: var(--accent); }
.star-off { color: var(--fg-muted); }

/* Chips: static labels */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); }
.chip-hot { background: var(--crit-soft); color: var(--crit); }
.chip-strong { background: var(--accent-soft); color: var(--accent); }
.chip-watch { background: var(--warn-soft); color: var(--warn); }
.chip-archive { background: var(--surface-2); color: var(--fg-muted); }
.chip-good { background: var(--good-soft); color: var(--good); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.tag { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.tag-fact { color: var(--good); }
.tag-inference { color: var(--warn); }
.tag-hypothesis { color: var(--fg-muted); }

/* Buttons */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--control);
  min-width: 44px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--fg);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.btn::before { content: ""; position: absolute; top: -3px; bottom: -3px; left: 0; right: 0; }
.btn:where(:hover) { border-color: var(--line); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--fg); }
.btn-text { background: transparent; border-color: transparent; color: var(--fg-muted); padding: 0 8px; font-weight: 500; }
.btn-text:where(:hover) { color: var(--fg); }
.btn-ghost[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--surface-2); border-color: transparent; color: var(--fg-muted); cursor: default; }

/* Pills: interactive toggles */
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--control);
  min-width: 44px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}
.pill::before { content: ""; position: absolute; top: -3px; bottom: -3px; left: 0; right: 0; }
.pill:where(:hover) { border-color: var(--fg-muted); }
.pill[aria-pressed="true"], .pill[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Segmented control */
.seg { display: inline-flex; gap: 2px; padding: 1px; background: var(--surface-2); border-radius: var(--radius-pill); }
.seg-btn {
  position: relative;
  min-height: 38px;
  min-width: 44px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--fg-muted);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}
.seg-btn::before { content: ""; position: absolute; top: -4px; bottom: -4px; left: 0; right: 0; }
.seg-btn:where(:hover) { color: var(--fg); }
.seg-btn[aria-pressed="true"] { background: var(--surface); border-color: var(--line); color: var(--fg); }

/* Switch */
.switch {
  position: relative;
  flex: none;
  width: 44px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  vertical-align: middle;
  cursor: pointer;
}
.switch::before { content: ""; position: absolute; top: -10px; bottom: -10px; left: -1px; right: -1px; }
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--fg-muted);
}
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.switch:disabled { opacity: .45; cursor: not-allowed; }

/* Fields */
.field {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--fg);
  font: 16px/1.5 var(--font-ui);
}
.field::placeholder { color: var(--fg-muted); }
.field:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.field-area { resize: vertical; }
.input-row { display: flex; align-items: stretch; gap: 8px; min-width: 0; }

/* Tables */
.table { width: 100%; border-collapse: collapse; }
.table-fixed { table-layout: fixed; }
.th { padding: 8px 4px; text-align: left; vertical-align: bottom; font-size: 12px; font-weight: 600; color: var(--fg-muted); }
.th-row { padding: 12px 4px; text-align: left; font-weight: 600; border-top: 1px solid var(--line); }
.td { padding: 12px 4px; vertical-align: middle; border-top: 1px solid var(--line); }

/* Toast */
.toast-region {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
  z-index: 30;
  display: flex;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.toast {
  max-width: 100%;
  padding: 10px 16px;
  border-radius: var(--radius);
  background: var(--fg);
  color: var(--bg);
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .15s ease, transform .15s ease;
}
.toast-on { opacity: 1; transform: none; }

@media (min-width: 640px) {
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (min-width: 1024px) {
  .app {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    column-gap: 24px;
    padding-block: 0 48px;
  }
  .nav {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    flex-direction: column;
    gap: 4px;
    background: transparent;
    border-top: 0;
    border-right: 1px solid var(--line);
    padding-left: 0;
    padding-right: 12px;
    padding-bottom: 24px;
  }
  .brand {
    display: flex;
    align-items: center;
    min-height: var(--header-h);
    margin-bottom: 16px;
    padding: 0 12px;
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
  }
  .nav-btn {
    flex: none;
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    min-height: 44px;
    padding: 0 12px;
    font-size: 14px;
  }
  .nav-btn:where(:hover) { background: var(--surface-2); }
  .nav-btn::before { top: 10px; bottom: 10px; left: 0; right: auto; width: 2px; height: auto; }
  .header { clip-path: inset(-100vmax -100vmax 0 -24px); }
  .page-title { font-size: 26px; }
  .header-layout { order: 2; flex: none; padding-bottom: 0; }
  .header-meta { order: 3; flex-direction: row; align-items: center; gap: 12px; }
  .split { display: grid; grid-template-columns: 360px minmax(0, 720px); gap: 24px; align-items: start; }
  .toast-region { bottom: 24px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

  return `${l.kommune} · ${sports} · ${l.members ? `${l.members} members` : 'members unknown'}`;
}

/* Focus keeping across re-renders: controls are identified by data-action + data-arg. */
function keyOf(el) {
  if (!el || !el.dataset || !el.dataset.action) return null;
  return `[data-action="${el.dataset.action}"][data-arg="${(el.dataset.arg || '').replace(/"/g, '\\"')}"]`;
}
function restore(selector) {
  if (!selector) return;
  const el = document.querySelector(selector);
  if (el) el.focus({ preventScroll: true });
}
function keep(fn) {
  const key = keyOf(document.activeElement);
  fn();
  restore(key);
}

/* Toast */
let toastTimer = null;
let toastHideTimer = null;
function toast(msg) {
  const el = $('toast');
  clearTimeout(toastTimer);
  clearTimeout(toastHideTimer);
  el.textContent = msg;
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('toast-on'));
  toastTimer = setTimeout(() => {
    el.classList.remove('toast-on');
    toastHideTimer = setTimeout(() => { el.hidden = true; }, 160);
  }, 2500);
}

/* Clipboard with select-the-text fallback */
function selectEl(el) {
  if (!el) return;
  if (typeof el.select === 'function') { el.focus(); el.select(); return; }
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
async function copyText(text, el) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied');
  } catch (e) {
    selectEl(el);
    toast('Text selected. Press ⌘C or Ctrl+C to copy');
  }
}

/* ---------- Today list ---------- */
function section(key, title, items, o, viewAll) {
  if (!items.length) return '';
  const btn = viewAll
    ? `<button type="button" class="btn btn-text" data-action="tab" data-arg="${viewAll.tab}" aria-label="${viewAll.label}">View all <span aria-hidden="true">→</span></button>`
    : '';
  return `<section class="section" aria-labelledby="sec-${key}">
  <div class="section-head"><h2 class="eyebrow" id="sec-${key}">${title}</h2>${btn}</div>
  <div class="cards">${items.map(i => cardFor(i, o)).join('')}</div>
</section>`;
}

function grouped(items, o) {
  const replies = items.filter(i => i.kind === 'reply');
  const leads = items.filter(i => i.kind === 'lead');
  const intel = items.filter(i => i.kind === 'intel');
  const newLeads = leads.filter(i => state.lead[i.id].status === 'new').length;
  return section('replies', `Reply drafts (${replies.length})`, replies, o)
    + section('leads', `Leads (${newLeads} new)`, leads, o, { tab: 'pipeline', label: 'View all leads in Pipeline' })
    + section('intel', `Competitor intel (${intel.length})`, intel, o, { tab: 'intel', label: 'View all competitor intel' });
}

function todayList(selected) {
  const items = todayItems();
  const o = { selected };
  if (state.variant === 'B') {
    const filters = [['all', 'All'], ['reply', 'Replies'], ['lead', 'Leads'], ['intel', 'Intel']];
    const list = items
      .filter(i => state.feedFilter === 'all' || i.kind === state.feedFilter)
      .sort((a, b) => a.ageH - b.ageH);
    return `<div class="pill-row" role="group" aria-label="Filter feed">${filters.map(([v, l]) => pill('feed', v, l, state.feedFilter === v)).join('')}</div>
<div class="cards">${list.map(i => cardFor(i, { ...o, feed: true })).join('')}</div>`;
  }
  if (state.variant === 'C') {
    const seg = Object.keys(DATA.products).map(p => {
      const n = items.filter(i => i.product === p).length;
      return `<button type="button" class="seg-btn" aria-pressed="${state.product === p}" data-action="product" data-arg="${p}">${esc(prodName(p))} (${n})</button>`;
    }).join('');
    const body = grouped(items.filter(i => i.product === state.product), o);
    return `<div><div class="seg" role="group" aria-label="Product">${seg}</div></div>
${body || `<p class="meta">Nothing for ${esc(prodName(state.product))} today.</p>`}`;
  }
  return grouped(items, o);
}

    return `<li class="row"><div class="card-line">
      <div class="grow stack-4">
        <div class="card-row"><span class="strong" id="src-name-${s.id}">${esc(s.name)}</span>${chip}</div>
        ${s.last ? `<p class="mono meta">${esc(s.last)}</p>` : ''}
        ${s.note ? `<p class="meta" id="${noteId}">${esc(s.note)}</p>` : ''}
      </div>
      <button type="button" class="switch" role="switch" aria-checked="${st === 'on'}" aria-labelledby="src-name-${s.id}"${s.note ? ` aria-describedby="${noteId}"` : ''}${st === 'unavailable' ? ' disabled' : ''} data-action="source" data-arg="${s.id}"></button>
    </div></li>`;
  }).join('');

  const playKeys = Object.keys(PLAYS);
  const playRows = Object.keys(DATA.products).map(p => `<tr>
      <th class="th-row" scope="row">${esc(prodName(p))}</th>
      ${playKeys.map(k => {
        const lock = DATA.playLocks[`${p}:${k}`];
        return `<td class="td"><button type="button" class="switch" role="switch" aria-checked="${state.plays[p][k]}" aria-label="${esc(prodName(p))}: ${PLAYS[k]}"${lock ? ' disabled aria-describedby="play-note"' : ''} data-action="play" data-arg="${p}:${k}"></button>${lock ? '<span class="meta" aria-hidden="true"> *</span>' : ''}</td>`;
      }).join('')}
    </tr>`).join('');
  const lockNotes = Object.entries(DATA.playLocks).map(([key, note]) => {
    const [p, k] = key.split(':');
    return `* ${esc(prodName(p))} ${PLAYS[k].toLowerCase()}: ${esc(note)}`;
  }).join(' ');

  const products = Object.entries(DATA.products).map(([id, p]) => `<article class="card">
      <h3 class="card-title">${esc(p.name)}</h3>
      <p>${esc(p.oneLiner)}</p>
      <p class="mono meta">${p.phrases} phrases · ${p.competitors} competitors · ${p.queries} queries</p>
      <div><button type="button" class="btn btn-ghost" data-action="edit-product" data-arg="${id}">Edit in products.yaml</button></div>
    </article>`).join('');

  const runs = DATA.runs.map(r => `<tr><td class="td mono">${r.date}</td><td class="td mono end">${r.fetched}</td><td class="td mono end">${r.signals}</td><td class="td mono end">${r.cost}</td></tr>`).join('');

  return `<div class="single">
  <section class="section" aria-labelledby="h-sources">
    <h2 class="eyebrow" id="h-sources">Sources</h2>
    <div class="card"><ul class="rows">${sources}</ul></div>
  </section>

  <section class="section" aria-labelledby="h-plays">
    <h2 class="eyebrow" id="h-plays">Plays per product</h2>
    <div class="card">
      <table class="table table-fixed">
        <thead><tr><th class="th" scope="col"><span class="sr-only">Product</span></th>${playKeys.map(k => `<th class="th" scope="col">${PLAYS[k]}</th>`).join('')}</tr></thead>
        <tbody>${playRows}</tbody>
      </table>
      <p class="meta" id="play-note">${lockNotes}</p>
    </div>
  </section>

  <section class="section" aria-labelledby="h-products">
    <h2 class="eyebrow" id="h-products">Products</h2>
    <div class="grid-2">${products}</div>
  </section>

  <section class="section" aria-labelledby="h-schedule">
    <h2 class="eyebrow" id="h-schedule">Schedule</h2>
    <div class="card">
      <p>${esc(DATA.schedule)}</p>
      <table class="table">
        <caption class="sr-only">Last 3 runs</caption>
        <thead><tr><th class="th" scope="col">Date</th><th class="th end" scope="col">Fetched</th><th class="th end" scope="col">Signals</th><th class="th end" scope="col">Cost</th></tr></thead>
        <tbody>${runs}</tbody>
      </table>
    </div>
  </section>
</div>`;
}

/* ---------- Render ---------- */
function defaultSel(tab) {
  if (tab === 'today') return DATA.replies[0].id;
  const first = filteredLeads()[0];
  return first ? first.id : DATA.leads[0].id;
}
function currentSel() {
  const t = state.tab;
  if (t !== 'today' && t !== 'pipeline') return null;
  if (isDesk()) return state.sel[t] || defaultSel(t);
  return state.detailOpen ? state.sel[t] : null;
}

function funnelHtml(hidden) {
  const f = DATA.funnel;
  const item = (label, value, title) => `<span class="funnel-item"${title ? ` title="${esc(title)}"` : ''}><span class="meta">${label}</span> <span class="mono">${value}</span></span>`;
  const dot = '<span class="meta" aria-hidden="true">·</span>';
  return `<p class="funnel"${hidden ? ' hidden' : ''}>${item('fetched', f.fetched, f.bySource)}${dot}${item('signals', f.signals)}${dot}${item('actions', f.actions)}${dot}${item('cost', f.cost)}</p>`;
}

function renderNav() {
  document.querySelectorAll('.nav-btn').forEach(b => {
    if (b.dataset.arg === state.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

function renderHeader() {
  const t = state.tab;
  const back = !isDesk() && state.detailOpen && !!currentSel();
  const layout = t === 'today' && !back;
  $('header').innerHTML = `<div class="header-title">${back ? '<button type="button" class="btn btn-text" data-action="back" data-arg=""><span aria-hidden="true">←</span> Back</button>' : ''}<h1 class="page-title">${TITLES[t]}</h1></div>
${layout ? `<div class="header-layout"><span class="meta" id="layout-label">Layout</span><div class="seg" role="group" aria-labelledby="layout-label">${Object.keys(VARIANTS).map(k => `<button type="button" class="seg-btn" aria-pressed="${state.variant === k}" aria-label="${k}: ${VARIANTS[k]}" data-action="variant" data-arg="${k}">${k}</button>`).join('')}</div><span class="meta">${VARIANTS[state.variant]}</span></div>` : ''}
<div class="header-meta"><span class="mono header-date">${DATA.run.label}</span><span class="chip">Example data</span></div>`;
  document.title = `${TITLES[t]} · SocialSelling`;
}

function renderList() {
  const el = $('list');
  if (!el) return;
  const sel = currentSel();
  el.innerHTML = state.tab === 'today' ? todayList(sel) : pipelineList(sel);
}

function renderDetail() {
  const el = $('detail');
  if (!el) return;
  const id = currentSel();
  if (id && isDesk() && !state.sel[state.tab]) state.sel[state.tab] = id; // pin the default selection
  el.innerHTML = id ? (id[0] === 'r' ? replyDetail(REPLY[id]) : leadDetail(LEAD[id])) : '';
  el.hidden = !id;
}

function renderView() {
  const t = state.tab;
  const view = $('view');
  if (t === 'today' || t === 'pipeline') {
    const sel = currentSel();
    const hideList = !isDesk() && !!sel;
    view.innerHTML = `${t === 'today' ? funnelHtml(hideList) : ''}
<div class="split">
  <div class="col-list" id="list"${hideList ? ' hidden' : ''}></div>
  <div class="col-detail" id="detail"${sel ? '' : ' hidden'}></div>
</div>`;
    renderList();
    renderDetail();
  } else {
    view.innerHTML = t === 'intel' ? intelView() : setupView();
  }
}

function render(focusSelector) {
  const key = keyOf(document.activeElement);
  renderNav();
  renderHeader();
  renderView();
  restore(focusSelector || key);
}

/* ---------- Routing ---------- */
function applyHash() {
  const h = location.hash.replace('#', '');
  const t = TABS.includes(h) ? h : 'today';
  const changed = t !== state.tab;
  state.tab = t;
  if (changed) state.detailOpen = false;
  render();
  if (t === 'intel' && state.intelFocus) {
    const card = $(`comp-${state.intelFocus.comp}`);
    if (card) {
      card.focus({ preventScroll: true });
      card.scrollIntoView({ block: 'start' });
    }
  } else if (changed) {
    window.scrollTo(0, 0);
  }
}
function go(tab) {
  if (location.hash === `#${tab}`) applyHash();
  else location.hash = tab;
}

/* ---------- Actions ---------- */
const ACTIONS = {
  tab(t) {
    state.intelFocus = null;
    state.detailOpen = false;
    go(t);
  },
  variant(k) {
    state.variant = k;
    persist();
    render();
  },
  feed(f) {
    state.feedFilter = f;
    persist();
    keep(renderList);
  },
  product(p) {
    state.product = p;
    persist();
    keep(renderList);
  },
  'lead-filter'(v) {
    state.leadFilter = v;
    keep(renderList);
  },
  'status-filter'(v) {
    state.statusFilter = v;
    keep(renderList);
  },
  open(id) {
    state.sel[state.tab] = id;
    if (isDesk()) {
      renderList();
      renderDetail();
      restore(`[data-action="open"][data-arg="${id}"]`);
      const detail = $('detail');
      if (detail && detail.getBoundingClientRect().top < 0) window.scrollTo(0, 0);
    } else {
      state.detailOpen = true;
      render();
      window.scrollTo(0, 0);
      const title = $('detail-title');
      if (title) title.focus({ preventScroll: true });
    }
  },
  back() {
    const id = state.sel[state.tab];
    state.detailOpen = false;
    const selector = `[data-action="open"][data-arg="${id}"]`;
    render(selector);
    const card = document.querySelector(selector);
    if (card) card.scrollIntoView({ block: 'center' });
  },
  'open-intel'(id) {
    const v = REVIEW[id];
    state.intelFocus = { comp: v.comp, review: id };
    state.detailOpen = false;
    go('intel');
  },
  nolink(id) {
    const s = state.reply[id];
    s.variant = s.variant === 'nolink' ? 'default' : 'nolink';
    s.text = REPLY[id].drafts[s.variant];
    syncDraft(id);
  },
  redraft(id) {
    const r = REPLY[id];
    const s = state.reply[id];
    const hasNoLink = r.drafts.nolink !== r.drafts.default;
    const cycle = ['default', 'nolink', 'redraft'].filter(v => v !== 'nolink' || hasNoLink);
    let i = cycle.indexOf(s.variant);
    if (i < 0) i = 0;
    s.variant = cycle[(i + 1) % cycle.length];
    s.text = r.drafts[s.variant];
    syncDraft(id);
    toast('Redrafted');
  },
  rate(arg) {
    const [id, v] = arg.split(':');
    const s = state.reply[id];
    s.rating = s.rating === v ? null : v;
    ['good', 'work'].forEach(k => {
      const b = $(`rate-${id}-${k}`);
      if (b) b.setAttribute('aria-pressed', String(s.rating === k));
    });
  },
  'copy-draft'(id) {
    const ta = $(`draft-${id}`);
    copyText(ta ? ta.value : state.reply[id].text, ta);
  },
  post(id) {
    const s = state.reply[id];
    if (!s.posted) {
      s.posted = true;
      s.undoTimer = setTimeout(() => { s.undoTimer = null; syncPost(id); }, 10000);
      toast('Marked as posted');
    } else if (s.undoTimer) {
      clearTimeout(s.undoTimer);
      s.undoTimer = null;
      s.posted = false;
      toast('Undone. Not marked as posted');
    } else {
      return;
    }
    syncPost(id);
    renderList();
  },
  status(arg) {
    const [id, st] = arg.split(':');
    if (state.lead[id].status === st) return;
    state.lead[id].status = st;
    syncStatus(id);
    renderList();
    toast(`Saved: ${STATUS_LABEL[st]}`);
  },
  'save-note'() {
    toast('Note saved');
  },
  signals(id) {
    const s = state.lead[id];
    s.showAll = !s.showAll;
    keep(() => { $(`signals-${id}`).innerHTML = signalsHtml(LEAD[id]); });
  },
  'copy-brief'(id) {
    copyText(LEAD[id].brief.join('\n'), $(`brief-${id}`));
  },
  'copy-email'(arg) {
    const [id, i] = arg.split(':');
    copyText(LEAD[id].contacts[Number(i)].email, $(`email-${id}-${i}`));
  },
  idea(id, btn) {
    state.ideas[id] = !state.ideas[id];
    btn.setAttribute('aria-pressed', String(state.ideas[id]));
    btn.textContent = state.ideas[id] ? 'Saved' : 'Save idea';
    toast(state.ideas[id] ? 'Idea saved' : 'Idea removed');
  },
  source(id) {
    const on = state.sources[id] === 'on';
    state.sources[id] = on ? 'off' : 'on';
    render();
    toast(`Saved: ${SOURCE[id].name} ${on ? 'off' : 'on'}`);
  },
  play(arg) {
    const [p, k] = arg.split(':');
    state.plays[p][k] = !state.plays[p][k];
    render();
    toast(`Saved: ${prodName(p)} ${PLAYS[k].toLowerCase()} ${state.plays[p][k] ? 'on' : 'off'}`);
  },
  'edit-product'() {
    toast('Edit products.yaml in the repo');
  },
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  const fn = ACTIONS[t.dataset.action];
  if (fn) fn(t.dataset.arg || '', t);
});

document.addEventListener('input', e => {
  const t = e.target;
  const kind = t.dataset ? t.dataset.input : null;
  if (!kind) return;
  const id = t.dataset.arg;
  if (kind === 'draft') {
    state.reply[id].text = t.value;
    const count = $(`count-${id}`);
    if (count) count.textContent = countLabel(t.value);
  } else if (kind === 'direction') {
    state.reply[id].direction = t.value;
  } else if (kind === 'note') {
    state.lead[id].note = t.value;
  }
});

document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape' && !isDesk() && state.detailOpen) {
    ACTIONS.back();
    return;
  }
  if (e.key === 'Enter' && t.dataset && t.dataset.input === 'direction') {
    e.preventDefault();
    ACTIONS.redraft(t.dataset.arg);
    return;
  }
  if (t.getAttribute && t.getAttribute('role') === 'radio') {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    const group = Array.from(t.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]'));
    const next = group[(group.indexOf(t) + step + group.length) % group.length];
    next.click();
    next.focus();
  }
});

window.addEventListener('hashchange', applyHash);
if (mq.addEventListener) mq.addEventListener('change', () => render());
else mq.addListener(() => render());

applyHash();
</script>
