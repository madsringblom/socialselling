<title>SocialSelling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/*
  Design plan: SocialSelling prototype (v2)
  Layout: one calm work surface. Mobile: single column, sticky compact header (52px),
  fixed bottom nav with four tabs. Desktop (>=1024px): 200px left rail; Today and Pipeline
  use a 360px list column plus a detail column (flex 1, max 720px); Intel and Setup are a
  single column, max 760px.
  Each screen answers one question. Today is a capped queue (max 5) that empties: every item
  ends in act / skip / later. Artifacts (draft, call brief, idea) first; scores and signals
  sit in collapsed details.
  Color: quiet grey-green neutrals and one sea-teal accent. Semantic good / warn / crit are
  kept separate from the accent. Classification: HOT = crit, STRONG = accent,
  WATCH = warn, ARCHIVE = muted.
  Type: Figtree for UI, Fraunces for page titles only, system mono for scores, counts and
  timestamps. Scale 13 / 14 (body) / 16 / 20 / 26. Eyebrows 12px uppercase, .06em tracking.
  Shape: 10px radius on cards, buttons and fields; 999px on pills and chips; 1px line
  borders; no shadows. Spacing 4 / 8 / 12 / 16 / 24 / 32. Controls 40px tall, 44px tap area.
*/
:root {
  --bg: #F7F8F8;
  --surface: #FFFFFF;
  --surface-2: #EFF3F3;
  --fg: #17201F;
  --fg-muted: #5A6866;
  --line: #DCE3E2;
  --accent: #0A6665;
  --accent-soft: #DDF1F0;
  --on-accent: #FFFFFF;
  --good: #2E7D4F;
  --good-soft: #EAF5EE;
  --warn: #8F5500;
  --warn-soft: #FBF0DF;
  --crit: #B23B3B;
  --crit-soft: #F9E5E4;
  --scrim: rgb(23 32 31 / .45);

  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Fraunces", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

  --radius: 10px;
  --radius-pill: 999px;
  --control: 40px;
  --header-h: 52px;
  --nav-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121517;
    --surface: #1A1F22;
    --surface-2: #232A2E;
    --fg: #E8ECEB;
    --fg-muted: #A3AEAC;
    --line: #2C3539;
    --accent: #4FB3B1;
    --accent-soft: #173A39;
    --on-accent: #0B1414;
    --good: #6CC08B;
    --good-soft: #1B3326;
    --warn: #E0A64A;
    --warn-soft: #3A2D14;
    --crit: #E07070;
    --crit-soft: #3D2121;
    --scrim: rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121517;
  --surface: #1A1F22;
  --surface-2: #232A2E;
  --fg: #E8ECEB;
  --fg-muted: #A3AEAC;
  --line: #2C3539;
  --accent: #4FB3B1;
  --accent-soft: #173A39;
  --on-accent: #0B1414;
  --good: #6CC08B;
  --good-soft: #1B3326;
  --warn: #E0A64A;
  --warn-soft: #3A2D14;
  --crit: #E07070;
  --crit-soft: #3D2121;
  --scrim: rgb(0 0 0 / .6);
  color-scheme: dark;
}

/* Base */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 14px/1.5 var(--font-ui);
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul, ol, blockquote { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[tabindex="-1"]:not(button):focus { outline: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.no-scroll { overflow: hidden; }

/* Shell */
.app {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 32px);
  min-height: 100vh;
}
.main { min-width: 0; }
.brand { display: none; }
.icon { width: 20px; height: 20px; flex: none; }
.icon-sm { width: 14px; height: 14px; flex: none; }

.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.nav-btn {
  position: relative;
  flex: 1 1 0;
  min-width: 0;
  min-height: var(--nav-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: none;
  border: 0;
  border-radius: var(--radius);
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.nav-btn:where(:hover) { color: var(--fg); }
.nav-btn:focus-visible { outline-offset: -4px; }
.nav-btn::before {
  content: "";
  position: absolute;
  top: 0;
  left: 25%;
  right: 25%;
  height: 2px;
  border-radius: var(--radius-pill);
  background: var(--accent);
  opacity: 0;
}
.nav-btn[aria-current="page"] { color: var(--accent); }
.nav-btn[aria-current="page"]::before { opacity: 1; }

.header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  column-gap: 12px;
  min-height: var(--header-h);
  margin-bottom: 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  /* full-bleed background behind the gutters, clipped below the header */
  box-shadow: 0 0 0 100vmax var(--bg);
  clip-path: inset(-100vmax -100vmax 0 -100vmax);
}
.header-title {
  order: 1;
  flex: 1 1 auto;
  min-width: 0;
  min-height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 4px;
}
.page-title {
  min-width: 0;
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 20px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-meta {
  order: 2;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
.header-date { font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
.header-actions {
  order: 3;
  flex: 1 0 100%;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding-bottom: 8px;
}

.view { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.split { min-width: 0; }
.col-list { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.col-detail { min-width: 0; }
.single { display: flex; flex-direction: column; gap: 24px; max-width: 760px; min-width: 0; }

/* Text helpers */
.eyebrow {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--fg-muted);
}
.meta { font-size: 13px; color: var(--fg-muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.strong { font-weight: 600; }
.end { text-align: right; }
.wrap { overflow-wrap: anywhere; min-width: 0; }
.grow { flex: 1 1 auto; min-width: 0; }
.line-1 { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.text-warn { color: var(--warn); }
.text-crit { color: var(--crit); }
.inline-icon { display: inline-flex; align-items: center; gap: 4px; }
.stack-4 { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stack-8 { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.link {
  display: inline-block;
  max-width: 100%;
  padding-block: 12px;
  margin-block: -12px;
  color: var(--accent);
  overflow-wrap: anywhere;
  text-underline-offset: 2px;
}
.divider { width: 100%; margin: 8px 0; border: 0; border-top: 1px solid var(--line); }

/* Funnel */
.funnel { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 13px; }
.funnel-item { white-space: nowrap; }

/* Sections and cards */
.section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
.cards { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  scroll-margin-top: 80px;
}
.card-click { cursor: pointer; }
.card-click:where(:hover) { border-color: var(--fg-muted); }
.is-selected { border-left: 3px solid var(--accent); padding-left: 14px; }
.card-title { min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
.card-hit {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 0;
  margin: 0;
  border: 0;
  background: none;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.card-hit::after {
  content: "";
  position: absolute;
  inset: -1px;
  z-index: 1;
  border-radius: var(--radius);
}
.card-hit:focus-visible { outline: none; }
.card-hit:focus-visible::after { outline: 2px solid var(--accent); outline-offset: 2px; }
.card-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.card-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.lead-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.score-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.score { font-size: 20px; font-weight: 600; line-height: 1; color: var(--fg); }
.score-big { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; line-height: 1; }
/* Lifts a control above the full-card click target */
.lift { position: relative; z-index: 2; }

.inset {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 16px;
  background: var(--surface-2);
  border-radius: var(--radius);
}
.quote { padding-left: 12px; border-left: 2px solid var(--line); }

.detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.detail-title { font-size: 20px; font-weight: 600; line-height: 1.3; }
.display { font-family: var(--font-display); font-weight: 500; }

/* Rows inside cards */
.rows { display: flex; flex-direction: column; min-width: 0; }
.row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding-block: 12px;
  border-top: 1px solid var(--line);
}
:where(.row):first-child { border-top: 0; padding-top: 0; }
:where(.row):last-child { padding-bottom: 0; }
.brief { display: grid; gap: 8px; padding-left: 20px; list-style: disc; }

/* Bars */
.bar-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 48px; gap: 12px; align-items: center; }
.bar { display: block; height: 8px; background: var(--surface-2); border-radius: var(--radius-pill); overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--accent); border-radius: var(--radius-pill); }

/* Stars */
.stars { white-space: nowrap; letter-spacing: 1px; }
.star-on { color: var(--accent); }
.star-off { color: var(--fg-muted); }

/* Chips: static labels */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 22px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  color: var(--fg-muted);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  white-space: nowrap;
}
.chip-accent { background: var(--accent-soft); color: var(--accent); }
.chip-hot { background: var(--crit-soft); color: var(--crit); }
.chip-strong { background: var(--accent-soft); color: var(--accent); }
.chip-watch { background: var(--warn-soft); color: var(--warn); }
.chip-archive { background: var(--surface-2); color: var(--fg-muted); }
.chip-good { background: var(--good-soft); color: var(--good); }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.tag { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .04em; }
.tag-fact { color: var(--good); }
.tag-inference { color: var(--warn); }
.tag-hypothesis { color: var(--fg-muted); }

/* Buttons */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--control);
  min-width: 44px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--fg);
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}
.btn::before { content: ""; position: absolute; top: -3px; bottom: -3px; left: 0; right: 0; }
.btn:where(:hover) { border-color: var(--line); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--fg); }
.btn-text { background: transparent; border-color: transparent; color: var(--fg-muted); padding: 0 8px; font-weight: 500; }
.btn-text:where(:hover) { color: var(--fg); }
.btn-ghost[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.btn:disabled, .btn[aria-disabled="true"] { background: var(--surface-2); border-color: transparent; color: var(--fg-muted); cursor: default; }

/* Pills: interactive toggles */
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
.pill {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--control);
  min-width: 44px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--fg);
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}
.pill::before { content: ""; position: absolute; top: -3px; bottom: -3px; left: 0; right: 0; }
.pill:where(:hover) { border-color: var(--fg-muted); }
.pill[aria-pressed="true"], .pill[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Skip chooser: in-card reasons */
.skip {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  cursor: default;
}

/* Switch */
.switch {
  position: relative;
  flex: none;
  width: 44px;
  height: 26px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  vertical-align: middle;
  cursor: pointer;
}
.switch::before { content: ""; position: absolute; top: -10px; bottom: -10px; left: -1px; right: -1px; }
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--fg-muted);
}
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.switch:disabled { opacity: .45; cursor: not-allowed; }

/* Fields */
.field {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--fg);
  font: 16px/1.5 var(--font-ui);
}
.field::placeholder { color: var(--fg-muted); }
.field:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.field-area { resize: vertical; }
.input-row { display: flex; align-items: stretch; gap: 8px; min-width: 0; }

/* Disclosure: native details with a 44px summary row */
.disclosures { gap: 0; padding-block: 4px; }
.disclosure { min-width: 0; }
.disclosure + .disclosure { border-top: 1px solid var(--line); }
.disclosure > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 44px;
  list-style: none;
  border-radius: var(--radius);
  cursor: pointer;
}
.disclosure > summary::-webkit-details-marker { display: none; }
.disclosure > summary:where(:hover) .eyebrow { color: var(--fg); }
.chev { color: var(--fg-muted); transition: transform .15s ease; }
.disclosure[open] > summary .chev { transform: rotate(180deg); }
.disclosure-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 4px 0 16px; }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-block: 32px; text-align: center; }
.empty-title { font-size: 26px; font-weight: 500; line-height: 1.2; }

/* Tables */
.table { width: 100%; border-collapse: collapse; }
.table-fixed { table-layout: fixed; }
.th { padding: 8px 4px; text-align: left; vertical-align: bottom; font-size: 12px; font-weight: 600; color: var(--fg-muted); }
.th-row { padding: 12px 4px; text-align: left; font-weight: 600; border-top: 1px solid var(--line); }
.td { padding: 12px 4px; vertical-align: middle; border-top: 1px solid var(--line); }

/* Toast */
.toast-region {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
  z-index: 30;
  display: flex;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.toast {
  max-width: 100%;
  padding: 10px 16px;
  border-radius: var(--radius);
  background: var(--fg);
  color: var(--bg);
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .15s ease, transform .15s ease;
}
.toast-on { opacity: 1; transform: none; }

/* Dialog */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--scrim);
}
.dialog {
  display: flex;
  flex-direction: column;
  gap: 16px;
  width: 100%;
  max-width: 480px;
  max-height: 100%;
  min-width: 0;
  overflow-y: auto;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.dialog-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.picks { display: flex; flex-direction: column; min-width: 0; }
.picks > li + li { border-top: 1px solid var(--line); }
.pick { display: flex; align-items: center; gap: 12px; min-width: 0; min-height: 44px; padding-block: 8px; cursor: pointer; }
.pick input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: inherit; }
.pick:has(input:disabled) { cursor: default; }
.error { font-size: 13px; color: var(--crit); }

@media (min-width: 640px) {
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dialog { padding: 24px; }
}

@media (min-width: 1024px) {
  .app {
    display: grid;
    grid-template-columns: 200px minmax(0, 1fr);
    column-gap: 24px;
    padding-block: 0 48px;
  }
  .nav {
    position: sticky;
    top: 0;
    align-self: start;
    height: 100vh;
    flex-direction: column;
    gap: 4px;
    background: transparent;
    border-top: 0;
    border-right: 1px solid var(--line);
    padding-left: 0;
    padding-right: 12px;
    padding-bottom: 24px;
  }
  .brand {
    display: flex;

  skipOpen: null,   // open skip chooser: 'card:<id>' | 'detail:<id>'
  open: {},         // <details> open state by data-key
  reply: {},
  lead: {},
  ideas: {},        // idea id -> 'saved' | 'dismissed'
  sources: {},
  plays: JSON.parse(JSON.stringify(DATA.plays)),
  dialog: { open: false, busy: false, picks: {}, trigger: null },
};
DATA.replies.forEach(r => {
  state.reply[r.id] = { variant: 'default', text: r.drafts.default, rating: null, posted: false, undoTimer: null, direction: '' };
});
DATA.leads.forEach(l => { state.lead[l.id] = { status: l.status, note: '', showAll: false, inSalgsro: false }; });
DATA.sources.forEach(s => { state.sources[s.id] = s.status; });

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const langAttr = lang => (lang && lang !== 'en' ? ` lang="${lang}"` : '');
const prodName = id => DATA.products[id].name;
const countLabel = text => `${text.length} characters`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const mq = window.matchMedia('(min-width: 1024px)');
const isDesk = () => mq.matches;

function fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${MONTHS[m - 1]} ${y}`;
}
function stars(n) {
  return `<span class="stars" role="img" aria-label="${n} of 5 stars"><span class="star-on">${'★'.repeat(n)}</span><span class="star-off">${'☆'.repeat(5 - n)}</span></span>`;
}
function extLink(href, text, title) {
  return `<a class="link" href="${esc(href)}" target="_blank" rel="noopener noreferrer"${title ? ` title="${esc(title)}"` : ''}>${esc(text)}<span aria-hidden="true">&nbsp;↗</span><span class="sr-only"> (opens in a new tab)</span></a>`;
}
function pill(action, value, label, on) {
  return `<button type="button" class="pill" aria-pressed="${on}" data-action="${action}" data-arg="${esc(value)}">${esc(label)}</button>`;
}
function statusChip(status) {
  const cls = status === 'meeting' ? ' chip-good' : (status === 'contacted' || status === 'replied') ? ' chip-accent' : '';
  return `<span class="chip${cls}">${STATUS_LABEL[status]}</span>`;
}
function leadMeta(l, short) {
  const sports = short && l.sports.length > 2 ? `${l.sports.slice(0, 2).join(', ')} +${l.sports.length - 2}` : l.sports.join(', ');
  return `${l.kommune} · ${sports} · ${l.members ? `${l.members} members` : 'members unknown'}`;
}
function disclosure(key, label, body) {
  return `<details class="disclosure" data-key="${key}"${state.open[key] ? ' open' : ''}>
  <summary><span class="eyebrow">${label}</span>${ICON_CHEVRON}</summary>
  <div class="disclosure-body">${body}</div>
</details>`;
}

/* Focus keeping across re-renders: controls are identified by data-action + data-arg. */
function keyOf(el) {
  if (!el || !el.dataset || !el.dataset.action) return null;
  return `[data-action="${el.dataset.action}"][data-arg="${(el.dataset.arg || '').replace(/"/g, '\\"')}"]`;
}
function restore(selector) {
  if (!selector) return false;
  const el = document.querySelector(selector);
  if (el) el.focus({ preventScroll: true });
  return !!el;
}
function keep(fn) {
  const key = keyOf(document.activeElement);
  fn();
  restore(key);
}

/* Toast */
let toastTimer = null;
let toastHideTimer = null;
function toast(msg) {
  const el = $('toast');
  clearTimeout(toastTimer);
  clearTimeout(toastHideTimer);
  el.textContent = msg;
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add('toast-on'));
  toastTimer = setTimeout(() => {
    el.classList.remove('toast-on');
    toastHideTimer = setTimeout(() => { el.hidden = true; }, 160);
  }, 2500);
}

/* Clipboard with select-the-text fallback */
function selectEl(el) {
  if (!el) return;
  if (typeof el.select === 'function') { el.focus(); el.select(); return; }
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}
async function copyText(text, el) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Copied');
  } catch (e) {
    selectEl(el);
    toast('Text selected. Press ⌘C or Ctrl+C to copy');
  }
}

/* ---------- Today queue ---------- */
const TODAY_ALL = [
  ...DATA.replies.map(r => ({ kind: 'reply', id: r.id })),
  ...DATA.today.leads.map(id => ({ kind: 'lead', id })),
];

/* Acted on: posted (after the undo window), or a lead that got a status or went to Salgsro. */
function isHandled(item) {
  if (item.kind === 'reply') {
    const s = state.reply[item.id];
    return s.posted && !s.undoTimer;
  }
  const s = state.lead[item.id];
  return s.status !== 'new' || s.inSalgsro;
}

/* open: what is left to do (capped). shown: open plus the selected item, so an item you just
   acted on does not vanish from under you; it leaves when you move on. */
function todayQueue(keepId) {
  const open = TODAY_ALL.filter(i => !state.queue[i.id] && !isHandled(i)).slice(0, TODAY_CAP);
  const openIds = open.map(i => i.id);
  const shown = TODAY_ALL.filter(i => openIds.includes(i.id) || (i.id === keepId && !state.queue[i.id]));
  const later = TODAY_ALL.filter(i => state.queue[i.id] === 'later' && (!isHandled(i) || i.id === keepId));
  return { open, shown, later };
}

/* ---------- Skip ---------- */
function skipButton(where, id, label, lang) {
  const key = `${where}:${id}`;
  return `<button type="button" class="btn btn-ghost lift" data-action="skip" data-arg="${key}" aria-expanded="${state.skipOpen === key}" aria-controls="skip-${where}-${id}">Skip${label ? `<span class="sr-only"${langAttr(lang)}>: ${esc(label)}</span>` : ''}</button>`;
}

function skipChooser(where, id) {
  const key = `${where}:${id}`;
  return `<div class="skip" id="skip-${where}-${id}" role="group" aria-labelledby="skip-label-${where}-${id}"${state.skipOpen === key ? '' : ' hidden'}>
  <p class="meta" id="skip-label-${where}-${id}">Why skip this?</p>
  <div class="pill-row">${SKIP_REASONS.map(([v, l]) => `<button type="button" class="pill" data-action="skip-reason" data-arg="${key}:${v}">${l}</button>`).join('')}<button type="button" class="btn btn-text" data-action="skip-cancel" data-arg="${key}">Cancel</button></div>
</div>`;
}

function showSkip(key, open) {
  const box = $(`skip-${key.replace(':', '-')}`);
  if (box) box.hidden = !open;
  const btn = document.querySelector(`[data-action="skip"][data-arg="${key}"]`);
  if (btn) btn.setAttribute('aria-expanded', String(open));
}

function setSkip(key, open) {
  if (state.skipOpen && state.skipOpen !== key) showSkip(state.skipOpen, false);
  state.skipOpen = open ? key : null;
  showSkip(key, open);
}

/* ---------- Cards ---------- */
function replyCard(r, o) {
  const s = state.reply[r.id];
  const sel = o.selected === r.id;
  return `<article class="card card-click${sel ? ' is-selected' : ''}">
  <div class="card-row meta"><span>${esc(r.source)} · ${r.ageH}h ago</span><span class="inline-icon${r.expiresH <= 2 ? ' text-warn' : ''}">${ICON_CLOCK}expires in ${r.expiresH}h</span><span class="chip chip-accent">${esc(prodName(r.product))}</span>${s.posted ? '<span class="chip"><span aria-hidden="true">✓</span> Posted</span>' : ''}</div>
  <h3 class="card-title"><button type="button" class="card-hit" data-action="open" data-arg="${r.id}"${sel ? ' aria-current="true"' : ''}><span class="clamp-2"${langAttr(r.lang)}>${esc(r.title)}</span></button></h3>
  <p class="meta line-1"${langAttr(r.lang)}>${esc(r.text)}</p>
  <div class="card-foot"><span class="chip">${TIERS[r.tier]}</span><div class="card-row">${o.noSkip ? '' : skipButton('card', r.id, r.title, r.lang)}<span class="btn btn-ghost" aria-hidden="true">Open draft</span></div></div>
  ${o.noSkip ? '' : skipChooser('card', r.id)}
</article>`;
}

function leadCard(l, o) {
  const s = state.lead[l.id];
  const sel = o.selected === l.id;
  const showStatus = o.showStatus || s.status !== 'new';
  const foot = o.today
    ? `<div class="card-foot"><span class="meta">${l.foundH < 24 ? 'found today' : `found ${Math.floor(l.foundH / 24)}d ago`}</span><div class="card-row">${o.noSkip ? '' : skipButton('card', l.id, l.name)}<span class="btn btn-ghost" aria-hidden="true">Open lead</span></div></div>
  ${o.noSkip ? '' : skipChooser('card', l.id)}`
    : '';
  return `<article class="card card-click${sel ? ' is-selected' : ''}">
  <div class="lead-top">
    <div class="stack-4">
      <h3 class="card-title"><button type="button" class="card-hit" data-action="open" data-arg="${l.id}"${sel ? ' aria-current="true"' : ''}>${esc(l.name)}</button></h3>
      <p class="meta">${esc(leadMeta(l, true))}</p>
    </div>
    <div class="score-box"><span class="score mono"><span class="sr-only">Score </span>${l.score}</span><span class="chip ${CLASS_CHIP[l.cls]}">${l.cls}</span></div>
  </div>
  <div class="card-line">${showStatus ? statusChip(s.status) : ''}${s.inSalgsro ? '<span class="chip">In Salgsro</span>' : ''}<p class="meta line-1">${esc(l.topSignal)}</p></div>
  ${foot}
</article>`;
}

function cardFor(item, o) {
  const opts = { ...o, noSkip: o.later || isHandled(item) };
  return item.kind === 'reply' ? replyCard(REPLY[item.id], opts) : leadCard(LEAD[item.id], opts);
}

/* ---------- Today list ---------- */
function section(key, title, items, o, viewAll) {
  if (!items.length) return '';
  const btn = viewAll
    ? `<button type="button" class="btn btn-text" data-action="tab" data-arg="${viewAll.tab}" aria-label="${viewAll.label}">View all <span aria-hidden="true">→</span></button>`
    : '';
  return `<section class="section" aria-labelledby="sec-${key}">
  <div class="section-head"><h2 class="eyebrow" id="sec-${key}">${title}</h2>${btn}</div>
  <div class="cards">${items.map(i => cardFor(i, o)).join('')}</div>
</section>`;
}

function todayList(selected) {
  const { open, shown, later } = todayQueue(selected);
  const o = { selected, today: true };
  const intel = `<p class="meta">Competitor intel: <span class="mono">${DATA.today.newGaps}</span> new gaps this week <a class="link" href="#intel"><span aria-hidden="true">→ </span>Intel</a></p>`;
  const laterHtml = later.length
    ? disclosure('later', `Later (${later.length})`, `<div class="cards">${later.map(i => cardFor(i, { ...o, later: true })).join('')}</div>`)
    : '';

  if (!open.length) {
    return `<div class="empty"><h2 class="empty-title display" id="today-done" tabindex="-1">Done for today.</h2><p class="meta">Next run ${esc(DATA.run.next)}.</p></div>
${laterHtml}${intel}`;
  }

  const soon = open.filter(i => i.kind === 'reply' && REPLY[i.id].expiresH <= DATA.run.hoursToNoon).length;
  const count = `<p class="meta" id="today-count" tabindex="-1"><span class="mono">${open.length}</span> ${open.length === 1 ? 'thing' : 'things'}${soon ? ` · <span class="mono">${soon}</span> ${soon === 1 ? 'expires' : 'expire'} before noon` : ''}</p>`;
  const replies = shown.filter(i => i.kind === 'reply');
  const leads = shown.filter(i => i.kind === 'lead');
  return count
    + section('replies', `Reply drafts (${replies.length})`, replies, o)
    + section('leads', `New leads (${leads.length})`, leads, o, { tab: 'pipeline', label: 'View all leads in Pipeline' })
    + laterHtml
    + intel;
}

/* ---------- Pipeline list ---------- */
function filteredLeads() {
  return DATA.leads
    .filter(l => state.leadFilter === 'all' || l.cls === state.leadFilter)
    .filter(l => {
      const s = state.lead[l.id];
      if (state.statusFilter === 'all') return true;
      if (state.statusFilter === 'salgsro') return s.inSalgsro;
      return s.status === state.statusFilter;
    })
    .sort((a, b) => b.score - a.score);
}

function pipelineList(selected) {
  const leads = filteredLeads();
  const classes = [['all', 'All'], ['HOT', 'HOT'], ['STRONG', 'STRONG'], ['WATCH', 'WATCH']];
  const statuses = [['all', 'All statuses'], ...STATUSES, ['salgsro', 'In Salgsro']];
  return `<div class="stack-8">

}

    <div><button type="button" class="btn btn-ghost" data-action="save-note" data-arg="${id}">Save note</button></div>
  </section>

  <div class="card disclosures">
    ${disclosure(`${id}-score`, 'Score breakdown', bars + adj)}
    ${disclosure(`${id}-signals`, `Signals (${l.signals.length})`, `<div class="stack-8" id="signals-${id}">${signalsHtml(l)}</div>`)}
    ${disclosure(`${id}-stack`, 'Digital stack', `<div class="card-row">${l.stack.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>`)}
    ${disclosure(`${id}-contacts`, `Contacts (${l.contacts.length})`, `<p class="meta">Only contact details the club publishes itself.</p><ul class="rows">${contacts}</ul>`)}
  </div>
</div>`;
}

function syncStatus(id) {
  const current = `${id}:${state.lead[id].status}`;
  document.querySelectorAll(`[data-action="status"][data-arg^="${id}:"]`).forEach(b => {
    const on = b.dataset.arg === current;
    b.setAttribute('aria-checked', String(on));
    b.tabIndex = on ? 0 : -1;
  });
}

/* ---------- Add-to-Salgsro dialog ---------- */
const pickCount = () => DATA.leads.filter(l => state.dialog.picks[l.id] && !state.lead[l.id].inSalgsro).length;
const addLabel = n => (n ? `Add ${plural(n, 'lead', 'leads')}` : 'Add leads');

function dialogHtml() {
  const d = state.dialog;
  const rows = [...DATA.leads].sort((a, b) => b.score - a.score).map(l => {
    const added = state.lead[l.id].inSalgsro;
    return `<li><label class="pick" for="pick-${l.id}">
      <input type="checkbox" id="pick-${l.id}" data-pick="${l.id}"${d.picks[l.id] ? ' checked' : ''}${added ? ' disabled' : ''}>
      <span class="grow stack-4"><span class="strong">${esc(l.name)}</span>${added ? '<span class="meta">already in Salgsro</span>' : ''}</span>
      <span class="mono"><span class="sr-only">Score </span>${l.score}</span><span class="chip ${CLASS_CHIP[l.cls]}">${l.cls}</span>
    </label></li>`;
  }).join('');
  const n = pickCount();
  return `<h2 class="detail-title display" id="dialog-title">Add to Salgsro</h2>
<p class="meta" id="dialog-desc">Only leads you tick are added. Nothing moves on its own.</p>
<ul class="picks">${rows}</ul>
<p class="error" id="dialog-error" role="alert" hidden></p>
<div class="dialog-foot">
  <button type="button" class="btn btn-ghost" data-action="dialog-cancel" data-arg="">Cancel</button>
  <button type="button" class="btn btn-primary" id="dialog-confirm" data-action="dialog-confirm" data-arg=""${n ? '' : ' disabled'}>${addLabel(n)}</button>
</div>`;
}

function setModal(on) {
  document.querySelector('.main').inert = on;
  document.querySelector('.nav').inert = on;
  document.documentElement.classList.toggle('no-scroll', on);
}

function dialogFocusables() {
  return Array.from($('dialog-panel').querySelectorAll('button, input, a[href]')).filter(x => !x.disabled);
}

function closeDialog(returnFocus = true) {
  const d = state.dialog;
  d.open = false;
  d.busy = false;
  $('dialog').hidden = true;
  $('dialog-panel').innerHTML = '';
  setModal(false);
  if (!returnFocus) return;
  if (d.trigger && d.trigger.isConnected) d.trigger.focus();
  else restore('[data-action="dialog-open"]');
}

/* ---------- Intel view ---------- */
function intelView() {
  const comps = DATA.competitors.map(c => ({ c, rs: DATA.reviews.filter(v => v.comp === c.id) }));
  const week = `Week ${DATA.run.week} · ${comps.map(({ c, rs }) => `${esc(c.name)} <span class="mono">${rs.length}</span> reviews`).join(' · ')}`;
  const compRows = comps.map(({ c, rs }) => {
    const avg = rs.length ? (rs.reduce((sum, v) => sum + v.stars, 0) / rs.length).toFixed(1) : null;
    return `<li class="row"><p><span class="strong">${esc(c.name)}</span><span class="meta"> · ${c.stores.join(', ')} · <span class="mono">${rs.length}</span> reviews${avg ? ` · avg <span class="mono">${avg}</span>★` : ''}</span></p></li>`;

  const row = v => `<li class="row">
      <p class="strong">${esc(v.insight)}</p>
      <div class="card-row meta">${stars(v.stars)}<span class="chip">${v.store}</span><span>${v.ageD}d ago</span><span class="chip chip-accent">${esc(COMP[v.comp].name)}</span></div>
      <p class="meta clamp-2" lang="${v.lang}">“${esc(v.text)}”</p>

  const ideas = DATA.ideas.filter(i => state.ideas[i.id] !== 'dismissed');
  const ideaRows = ideas.map(i => {
    const saved = state.ideas[i.id] === 'saved';
    return `<li class="row"><div class="stack-8">
      <div class="stack-4"><p class="strong" id="idea-t-${i.id}">${esc(i.text)}</p><p class="meta">Gap: ${esc(i.from)}</p></div>
      <div class="card-row">
        <button type="button" class="btn btn-ghost" aria-pressed="${saved}" aria-describedby="idea-t-${i.id}" data-action="idea" data-arg="${i.id}">${saved ? 'Saved' : 'Save idea'}</button>
        <button type="button" class="btn btn-ghost" aria-describedby="idea-t-${i.id}" data-action="idea-dismiss" data-arg="${i.id}">Dismiss</button>
      </div>
    </div></li>`;
  }).join('');

  return `<div class="single">
  <p class="meta">${week}</p>
  <section class="section" aria-labelledby="h-ideas">
    <h2 class="eyebrow" id="h-ideas" tabindex="-1">Ideas (${ideas.length})</h2>
    <div class="card">${ideas.length ? `<ul class="rows">${ideaRows}</ul>` : '<p class="meta">No open ideas this week.</p>'}</div>
  </section>
  <section class="section" aria-labelledby="h-comps">
    <h2 class="eyebrow" id="h-comps">Competitors</h2>
    <div class="card"><ul class="rows">${compRows}</ul></div>
  </section>
  ${listSection('gaps', 'Gaps users mention', DATA.reviews.filter(v => v.kind === 'gap').sort(byAge), 'No gaps mentioned this week.')}
  ${listSection('praise', 'What users praise', DATA.reviews.filter(v => v.kind === 'praise').sort(byAge), 'No praise this week.')}
  ${listSection('switch', 'Switching intent', DATA.reviews.filter(v => v.kind === 'switch').sort(byAge), "No one said they're leaving this week.")}
</div>`;
}

    const st = state.sources[s.id];

      </div>

      ${playKeys.map(k => {
        const lock = DATA.playLocks[`${p}:${k}`];
        return `<td class="td"><button type="button" class="switch" role="switch" aria-checked="${state.plays[p][k]}" aria-label="${esc(prodName(p))}: ${PLAYS[k]}"${lock ? ' disabled aria-describedby="play-note"' : ''} data-action="play" data-arg="${p}:${k}"></button>${lock ? '<span class="meta" aria-hidden="true"> *</span>' : ''}</td>`;

      <p class="mono meta">${p.phrases} phrases · ${p.competitors} competitors · ${p.queries} queries</p>
      <div><button type="button" class="btn btn-ghost" data-action="edit-product" data-arg="${id}">Edit in products.yaml</button></div>

  return `<div class="single">
  <section class="section" aria-labelledby="h-run">
    <h2 class="eyebrow" id="h-run">Today's run</h2>
    <div class="card">
      ${funnelHtml()}
      <p class="meta mono">${esc(f.bySource)}</p>
      <hr class="divider">
      <div class="stack-4">
        <p class="meta strong">Why Today might be empty</p>
        <p class="meta">Sources ran, ${f.signals} signals found, ${f.actions} made the cut (cap ${TODAY_CAP}).</p>
      </div>
    </div>

  <section class="section" aria-labelledby="h-sources">

  <section class="section" aria-labelledby="h-plays">

        <tbody>${playRows}</tbody>
      </table>
      <p class="meta" id="play-note">${lockNotes}</p>

  <section class="section" aria-labelledby="h-products">

/* ---------- Render ---------- */
function defaultSel(tab) {
  if (tab === 'today') {
    const first = todayQueue().open[0];
    return first ? first.id : null;
  }
  const first = filteredLeads()[0];
  return first ? first.id : DATA.leads[0].id;
}
function currentSel() {
  const t = state.tab;
  if (t !== 'today' && t !== 'pipeline') return null;
  if (isDesk()) return state.sel[t] || defaultSel(t);
  return state.detailOpen ? state.sel[t] : null;
}

function renderNav() {
  document.querySelectorAll('.nav-btn').forEach(b => {
    if (b.dataset.arg === state.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
}

function renderHeader() {
  const t = state.tab;
  const back = !isDesk() && state.detailOpen && !!currentSel();
  const actions = t === 'pipeline' && !back;
  $('header').innerHTML = `<div class="header-title">${back ? '<button type="button" class="btn btn-text" data-action="back" data-arg=""><span aria-hidden="true">←</span> Back</button>' : ''}<h1 class="page-title">${TITLES[t]}</h1></div>
${actions ? '<div class="header-actions"><button type="button" class="btn btn-primary" data-action="dialog-open" data-arg="" aria-haspopup="dialog">Add top leads to Salgsro</button></div>' : ''}
<div class="header-meta"><span class="mono header-date">${DATA.run.label}</span><span class="chip">Example data</span></div>`;
  document.title = `${TITLES[t]} · SocialSelling`;
}

function renderList() {
  const el = $('list');
  if (!el) return;
  const sel = currentSel();
  el.innerHTML = state.tab === 'today' ? todayList(sel) : pipelineList(sel);
}

function renderDetail() {
  const el = $('detail');
  if (!el) return;
  const id = currentSel();
  if (id && isDesk() && !state.sel[state.tab]) state.sel[state.tab] = id; // pin the default selection
  el.innerHTML = id ? (id[0] === 'r' ? replyDetail(REPLY[id]) : leadDetail(LEAD[id])) : '';
  el.hidden = !id;
}

function renderView() {
  const t = state.tab;
  const view = $('view');
  if (t === 'today' || t === 'pipeline') {
    const sel = currentSel();
    const hideList = !isDesk() && !!sel;
    view.innerHTML = `<div class="split">
  <div class="col-list" id="list"${hideList ? ' hidden' : ''}></div>
  <div class="col-detail" id="detail"${sel ? '' : ' hidden'}></div>
</div>`;
    renderList();
    renderDetail();
  } else {
    view.innerHTML = t === 'intel' ? intelView() : setupView();
  }
}

function render(focusSelector) {
  const key = keyOf(document.activeElement);
  renderNav();
  renderHeader();
  renderView();
  restore(focusSelector || key);
}

/* Focus after an item leaves Today: the next card, else the count line or the done state. */
function focusTodayFallback() {
  return restore('#today-count') || restore('#today-done');
}

/* ---------- Routing ---------- */
function applyHash() {
  const h = location.hash.replace('#', '');
  const t = TABS.includes(h) ? h : 'today';
  const changed = t !== state.tab;
  if (state.dialog.open) closeDialog(false);
  state.tab = t;
  if (changed) {
    state.detailOpen = false;
    state.skipOpen = null;
  }
  render();
  if (changed) window.scrollTo(0, 0);
}
function go(tab) {
  if (location.hash === `#${tab}`) applyHash();
  else location.hash = tab;
}

/* ---------- Actions ---------- */
const ACTIONS = {
  tab(t) {
    state.detailOpen = false;
    go(t);
  },
  'lead-filter'(v) {
    state.leadFilter = v;
    keep(renderList);
  },
  'status-filter'(v) {
    state.statusFilter = v;
    keep(renderList);
  },
  open(id) {
    state.sel[state.tab] = id;
    if (isDesk()) {
      renderList();
      renderDetail();
      restore(`[data-action="open"][data-arg="${id}"]`);
      const detail = $('detail');
      if (detail && detail.getBoundingClientRect().top < 0) window.scrollTo(0, 0);
    } else {
      state.detailOpen = true;
      render();
      window.scrollTo(0, 0);
      const title = $('detail-title');
      if (title) title.focus({ preventScroll: true });
    }
  },
  back() {
    const id = state.sel[state.tab];
    state.detailOpen = false;
    const selector = `[data-action="open"][data-arg="${id}"]`;
    render(selector);
    const card = document.querySelector(selector);
    if (card) card.scrollIntoView({ block: 'center' });
    else if (state.tab === 'today') focusTodayFallback();
  },

  /* Skip: open the reason chooser, pick a reason, or cancel */
  skip(key) {
    const open = state.skipOpen !== key;
    setSkip(key, open);
    if (open) {
      const first = document.querySelector(`#skip-${key.replace(':', '-')} .pill`);
      if (first) first.focus();
    }
  },
  'skip-cancel'(key) {
    setSkip(key, false);
    restore(`[data-action="skip"][data-arg="${key}"]`);
  },
  'skip-reason'(arg) {
    const [where, id, reason] = arg.split(':');
    const later = reason === 'later';
    const before = todayQueue().open.map(i => i.id);
    state.queue[id] = later ? 'later' : 'skipped';
    state.skipReason[id] = reason;
    state.skipOpen = null;
    const after = todayQueue().open.map(i => i.id);
    const pos = before.indexOf(id);
    const next = before.slice(pos + 1).find(x => after.includes(x))
      || before.slice(0, Math.max(pos, 0)).reverse().find(x => after.includes(x))
      || null;
    const target = next ? `[data-action="open"][data-arg="${next}"]` : null;
    const wasSelected = state.sel.today === id;
    if (wasSelected) state.sel.today = isDesk() ? next : null;

    if (isDesk()) {
      renderList();
      if (wasSelected) renderDetail();
      if (!restore(target)) focusTodayFallback();
    } else {
      if (where === 'detail') state.detailOpen = false;
      render(target);
      if (!target) focusTodayFallback();
      if (where === 'detail') {
        const el = document.activeElement;
        if (el && el !== document.body) el.scrollIntoView({ block: 'center' });
      }
    }
    toast(later ? 'Moved to Later' : 'Skipped · teaches the filter');
  },

  nolink(id) {
    const s = state.reply[id];
    s.variant = s.variant === 'nolink' ? 'default' : 'nolink';
    s.text = REPLY[id].drafts[s.variant];
    syncDraft(id);
  },
  redraft(id) {
    const r = REPLY[id];
    const s = state.reply[id];
    const hasNoLink = r.drafts.nolink !== r.drafts.default;
    const cycle = ['default', 'nolink', 'redraft'].filter(v => v !== 'nolink' || hasNoLink);
    let i = cycle.indexOf(s.variant);
    if (i < 0) i = 0;
    s.variant = cycle[(i + 1) % cycle.length];
    s.text = r.drafts[s.variant];
    syncDraft(id);
    toast('Redrafted');
  },
  rate(arg) {
    const [id, v] = arg.split(':');
    const s = state.reply[id];
    s.rating = s.rating === v ? null : v;
    ['good', 'work'].forEach(k => {
      const b = $(`rate-${id}-${k}`);
      if (b) b.setAttribute('aria-pressed', String(s.rating === k));
    });
  },
  'copy-draft'(id) {
    const ta = $(`draft-${id}`);
    copyText(ta ? ta.value : state.reply[id].text, ta);
  },
  post(id) {
    const s = state.reply[id];
    if (!s.posted) {
      s.posted = true;
      s.undoTimer = setTimeout(() => {
        s.undoTimer = null;
        syncPost(id);
        keep(renderList);
      }, 10000);
      toast('Marked as posted');
    } else if (s.undoTimer) {
      clearTimeout(s.undoTimer);
      s.undoTimer = null;
      s.posted = false;
      toast('Undone. Not marked as posted');
    } else {
      return;
    }
    syncPost(id);
    keep(renderList);
  },
  status(arg) {
    const [id, st] = arg.split(':');
    if (state.lead[id].status === st) return;
    state.lead[id].status = st;
    syncStatus(id);
    keep(renderList);
    toast(`Saved: ${STATUS_LABEL[st]}`);
  },
  'save-note'() {
    toast('Note saved');
  },
  signals(id) {
    const s = state.lead[id];
    s.showAll = !s.showAll;
    keep(() => { $(`signals-${id}`).innerHTML = signalsHtml(LEAD[id]); });
  },
  'copy-brief'(id) {
    copyText(LEAD[id].brief.join('\n'), $(`brief-${id}`));
  },
  'copy-email'(arg) {
    const [id, i] = arg.split(':');
    copyText(LEAD[id].contacts[Number(i)].email, $(`email-${id}-${i}`));
  },
  'add-lead'(id) {
    state.lead[id].inSalgsro = true;
    syncSalgsro(id);
    renderList();
    restore(`#salgsro-link-${id}`);
    toast('Added to Salgsro');
  },

  /* Add-to-Salgsro dialog */
  'dialog-open'(arg, btn) {
    const d = state.dialog;
    d.open = true;
    d.busy = false;
    d.trigger = btn;
    d.picks = {};
    DATA.leads.forEach(l => {
      d.picks[l.id] = !state.lead[l.id].inSalgsro && (l.cls === 'HOT' || l.cls === 'STRONG');
    });
    $('dialog-panel').innerHTML = dialogHtml();
    $('dialog').hidden = false;
    setModal(true);
    const first = dialogFocusables()[0];
    if (first) first.focus();
  },
  'dialog-cancel'() {
    if (!state.dialog.busy) closeDialog();
  },
  'dialog-confirm'(arg, btn) {
    const d = state.dialog;
    const ids = DATA.leads.filter(l => d.picks[l.id] && !state.lead[l.id].inSalgsro).map(l => l.id);
    if (!ids.length || d.busy) return;
    d.busy = true;
    btn.textContent = 'Adding…';
    btn.setAttribute('aria-disabled', 'true');
    $('dialog-panel').setAttribute('aria-busy', 'true');
    $('dialog-panel').querySelectorAll('[data-pick]').forEach(c => { c.disabled = true; });
    setTimeout(() => {
      if (!d.open) return;
      ids.forEach(id => {
        state.lead[id].inSalgsro = true;
        syncSalgsro(id);
      });
      $('dialog-panel').removeAttribute('aria-busy');
      renderList();
      closeDialog();
      toast(`Added ${plural(ids.length, 'lead', 'leads')} to Salgsro`);
    }, 600);
  },

  idea(id) {
    if (state.ideas[id] === 'saved') delete state.ideas[id];
    else state.ideas[id] = 'saved';
    render();
    toast(state.ideas[id] ? 'Idea saved' : 'Idea removed');
  },
  'idea-dismiss'(id) {
    const list = DATA.ideas.filter(i => state.ideas[i.id] !== 'dismissed').map(i => i.id);
    const pos = list.indexOf(id);
    state.ideas[id] = 'dismissed';
    const rest = list.filter(x => x !== id);
    const next = rest[Math.min(pos, rest.length - 1)];
    render(next ? `[data-action="idea"][data-arg="${next}"]` : '#h-ideas');
    toast('Idea dismissed');
  },
  source(id) {
    const on = state.sources[id] === 'on';
    state.sources[id] = on ? 'off' : 'on';
    render();
    toast(`Saved: ${SOURCE[id].name} ${on ? 'off' : 'on'}`);
  },
  play(arg) {
    const [p, k] = arg.split(':');
    state.plays[p][k] = !state.plays[p][k];
    render();
    toast(`Saved: ${prodName(p)} ${PLAYS[k].toLowerCase()} ${state.plays[p][k] ? 'on' : 'off'}`);
  },
  'edit-product'() {
    toast('Edit products.yaml in the repo');
  },
};

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  if (state.dialog.open && e.target === $('dialog')) {
    if (!state.dialog.busy) closeDialog();
    return;
  }
  const t = e.target.closest('[data-action]');
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  const fn = ACTIONS[t.dataset.action];
  if (fn) fn(t.dataset.arg || '', t);
});

document.addEventListener('input', e => {
  const t = e.target;
  const kind = t.dataset ? t.dataset.input : null;
  if (!kind) return;
  const id = t.dataset.arg;
  if (kind === 'draft') {
    state.reply[id].text = t.value;
    const count = $(`count-${id}`);
    if (count) count.textContent = countLabel(t.value);
  } else if (kind === 'direction') {
    state.reply[id].direction = t.value;
  } else if (kind === 'note') {
    state.lead[id].note = t.value;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.pick || state.dialog.busy) return;
  state.dialog.picks[t.dataset.pick] = t.checked;
  const n = pickCount();
  const btn = $('dialog-confirm');
  if (!btn) return;
  btn.textContent = addLabel(n);
  btn.disabled = n === 0;
});

/* <details> toggle does not bubble: listen in the capture phase to remember open state. */
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.key) state.open[d.dataset.key] = d.open;
}, true);

document.addEventListener('keydown', e => {
  const t = e.target;

  if (state.dialog.open) {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (!state.dialog.busy) closeDialog();
      return;
    }
    if (e.key === 'Tab') {
      const f = dialogFocusables();
      if (!f.length) { e.preventDefault(); return; }
      const first = f[0];
      const last = f[f.length - 1];
      const inside = $('dialog-panel').contains(document.activeElement);
      if (e.shiftKey && (document.activeElement === first || !inside)) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && (document.activeElement === last || !inside)) {
        e.preventDefault();
        first.focus();
      }
    }
    return;
  }

  if (e.key === 'Escape' && state.skipOpen) {
    const inChooser = t.closest && t.closest('.skip');
    const onTrigger = t.dataset && t.dataset.action === 'skip';
    if (inChooser || onTrigger) {
      e.preventDefault();
      ACTIONS['skip-cancel'](state.skipOpen);
      return;
    }
  }
  if (e.key === 'Escape' && !isDesk() && state.detailOpen) {
    ACTIONS.back();
    return;
  }
  if (e.key === 'Enter' && t.dataset && t.dataset.input === 'direction') {
    e.preventDefault();
    ACTIONS.redraft(t.dataset.arg);
    return;
  }
  if (t.getAttribute && t.getAttribute('role') === 'radio') {
    const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
    if (!step) return;
    e.preventDefault();
    const group = Array.from(t.closest('[role="radiogroup"]').querySelectorAll('[role="radio"]'));
    const next = group[(group.indexOf(t) + step + group.length) % group.length];
    next.click();
    next.focus();
  }
});

window.addEventListener('hashchange', applyHash);
if (mq.addEventListener) mq.addEventListener('change', () => render());
else mq.addListener(() => render());

applyHash();
</script>
